name: budget
description: "Budgie — a private, offline personal budgeting app for Android."
publish_to: 'none'
version: 0.4.0+5

environment:
  sdk: ^3.12.2

dependencies:
  collection: ^1.19.1
  cryptography: ^2.9.0
  drift: ^2.34.1
  drift_flutter: ^0.3.0
  dynamic_color: ^1.8.1
  file_picker: ^10.3.3
  fl_chart: ^1.2.0
  flutter:
    sdk: flutter
  flutter_local_notifications: ^22.0.1
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.3.2
  go_router: ^17.3.0
  google_mlkit_text_recognition: ^0.16.0
  home_widget: ^0.9.3
  image_picker: ^1.2.3
  intl: any
  local_auth: ^3.0.2
  meta: ^1.18.0
  path_provider: ^2.1.6
  quick_actions: ^1.1.0
  rxdart: ^0.28.0
  share_plus: 12.0.2
  simple_icons: ^16.23.0
  timezone: ^0.11.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.15.1
  drift_dev: ^2.34.0
  very_good_analysis: ^10.3.0
  mocktail: ^1.0.5
  flutter_launcher_icons: ^0.14.4
  sqlite3: 3.3.4

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/brands/

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "assets/icon/background.png"
  adaptive_icon_foreground: "assets/icon/foreground.png"
  min_sdk_android: 26
